<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Invoice {{ payment.invoice_number }}</title></head>
<body>
  <h1>Invoice {{ payment.invoice_number }}</h1>
  <p><strong>Company:</strong> {{ company_name }}</p>
  <p><strong>Opportunity:</strong> {{ opportunity_name }}</p>
  <p><strong>Customer:</strong> {{ customer_name }}</p>
  <p><strong>Total:</strong> {{ payment.total_amount }} {{ payment.currency }}</p>
  <p><strong>Paid:</strong> {{ payment.paid_amount }}</p>
  <p><strong>Balance:</strong> {{ payment.balance }}</p>
  <p><strong>Status:</strong> {{ payment.get_status_display }}</p>
</body>
</html>
