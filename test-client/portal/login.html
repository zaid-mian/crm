<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OrbitCRM JTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
    <style>
        .login-container {
            max-width: 420px;
            margin: 80px auto;
        }
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container card">
            <h2>Portal Sign-In</h2>
            <div id="alert-box"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Username or Email Address</label>
                    <input type="text" id="email" class="form-control" placeholder="username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-login" class="btn w-100 py-2 mt-3">Log In</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none;">Register here</a>
            </p>
            <p style="text-align: center; margin-top: 5px; font-size: 13px; color: var(--text-muted);">
                Forgot Password? <a href="javascript:void(0)" onclick="forgotPasswordPopup()" style="color: var(--primary); text-decoration: none;">Reset here</a>
            </p>
        </div>
    </div>

    <!-- Status Modal for Pending / Rejection notices -->
    <div class="modal-backdrop" id="status-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom: 15px; color: #ffffff;">Account Status</h3>
            <p id="modal-message" style="color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 25px;"></p>
            <button class="btn w-100" onclick="closeModal()">Understood</button>
        </div>
    </div>

    <script>
        const API_BASE = localStorage.getItem('apiBaseUrl') || 
            (window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : 'http://localhost:8000');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerText = 'Authenticating...';

            try {
                const response = await fetch(`${API_BASE}/api/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') || ''
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username: email, password: password })
                });

                const data = await response.json();
                btn.disabled = false;
                btn.innerText = 'Log In';

                if (response.ok) {
                    // Fetch user info to determine role and redirect
                    const meRes = await fetch(`${API_BASE}/api/me/`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    const meData = await meRes.json();
                    
                    if (meRes.ok && meData.success) {
                        localStorage.setItem('user', JSON.stringify(meData.data));
                        localStorage.setItem('isAuthenticated', 'true');
                        
                        alertBox.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
                        
                        setTimeout(() => {
                            if (meData.data.is_staff || meData.data.is_superuser) {
                                window.location.href = 'admin.html';
                            } else {
                                window.location.href = 'dashboard.html';
                            }
                        }, 800);
                    } else {
                        alertBox.innerHTML = `<div class="alert alert-danger">Failed to retrieve user profile details.</div>`;
                    }
                } else {
                    if (response.status === 403) {
                        // Detailed JTS approval queue state notices
                        const errMsg = data.error || '';
                        if (errMsg.toLowerCase().includes('pending')) {
                            showModal('Registration Pending', 'Your business profile is currently in the administration review queue. Please await email activation notifications.');
                        } else if (errMsg.toLowerCase().includes('rejected')) {
                            showModal('Registration Rejected', errMsg);
                        } else {
                            alertBox.innerHTML = `<div class="alert alert-danger">${errMsg || 'Access Denied.'}</div>`;
                        }
                    } else {
                        alertBox.innerHTML = `<div class="alert alert-danger">${data.error || 'Invalid email or password.'}</div>`;
                    }
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Log In';
                alertBox.innerHTML = `<div class="alert alert-danger">Network Error: Failed to reach backend API at ${API_BASE}.</div>`;
            }
        });

        function showModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('status-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('status-modal').style.display = 'none';
        }

        async function forgotPasswordPopup() {
            const email = prompt("Enter your registered email address to request a reset link:");
            if (!email) return;

            try {
                const response = await fetch(`${API_BASE}/api/auth/forgot-password/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') || ''
                    },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message || "Reset link sent! Please check the terminal logs.");
                } else {
                    alert(data.error || "Failed to trigger password recovery.");
                }
            } catch (err) {
                alert("Network Error: Failed to request reset.");
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
