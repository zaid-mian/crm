<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Registration - OrbitCRM JTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
    <style>
        .register-container {
            max-width: 600px;
            margin: 40px auto;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container card">
            <h2>Tenant Sign-Up Registration</h2>
            <div id="alert-box"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="full_name">Owner Full Name *</label>
                    <input type="text" id="full_name" class="form-control" placeholder="Jane Doe" required>
                    <div class="invalid-feedback" id="err-full_name"></div>
                </div>

                <div class="form-group">
                    <label for="email">Business Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="jane@company.com" required>
                    <div class="invalid-feedback" id="err-email"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <div class="invalid-feedback" id="err-password"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password *</label>
                        <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                        <div class="invalid-feedback" id="err-confirm_password"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="company_name">Company / Organization Name *</label>
                    <input type="text" id="company_name" class="form-control" placeholder="Jane Corp" required>
                    <div class="invalid-feedback" id="err-company_name"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone_number">Phone Number *</label>
                        <input type="tel" id="phone_number" class="form-control" placeholder="+923001234567" required>
                        <div class="invalid-feedback" id="err-phone_number"></div>
                    </div>
                    <div class="form-group">
                        <label for="cnic">CNIC Number *</label>
                        <input type="text" id="cnic" class="form-control" placeholder="12345-6789012-3" required>
                        <div class="invalid-feedback" id="err-cnic"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Country *</label>
                        <input type="text" id="country" class="form-control" placeholder="Pakistan" required>
                        <div class="invalid-feedback" id="err-country"></div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" class="form-control" placeholder="Office 12, Floor 3, Tech Plaza" required>
                        <div class="invalid-feedback" id="err-address"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="logo">Company Logo (Optional)</label>
                    <input type="file" id="logo" class="form-control" accept="image/*">
                    <div class="invalid-feedback" id="err-logo"></div>
                </div>

                <button type="submit" id="btn-register" class="btn w-100 py-2 mt-3">Register Account</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none;">Login here</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE = localStorage.getItem('apiBaseUrl') || 
            (window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8000' : 'http://localhost:8000');

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear prior errors
            document.querySelectorAll('.invalid-feedback').forEach(el => el.innerText = '');
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';

            const fullName = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const companyName = document.getElementById('company_name').value.trim();
            const phoneNumber = document.getElementById('phone_number').value.trim();
            const cnic = document.getElementById('cnic').value.trim();
            const country = document.getElementById('country').value.trim();
            const address = document.getElementById('address').value.trim();

            // Client side match check
            if (password !== confirmPassword) {
                document.getElementById('err-confirm_password').innerText = "Passwords do not match.";
                return;
            }

            // Split full name
            const parts = fullName.split(/\s+/);
            const firstName = parts[0];
            const lastName = parts.slice(1).join(' ') || 'Owner';

            const payload = {
                email: email,
                password: password,
                first_name: firstName,
                last_name: lastName,
                company_name: companyName,
                phone_number: phoneNumber,
                cnic: cnic,
                country: country,
                address: address
            };

            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.innerText = 'Submitting Registration...';

            try {
                const response = await fetch(`${API_BASE}/api/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                btn.disabled = false;
                btn.innerText = 'Register Account';

                if (response.ok) {
                    // Success
                    alertBox.innerHTML = `
                        <div class="alert alert-success">
                            <strong>Registration Submitted!</strong><br>
                            Your registration request has been submitted successfully. Please await administrator review and approval.
                        </div>
                    `;
                    document.getElementById('register-form').reset();
                } else {
                    // Handle validation errors returned by DRF serializer
                    if (data.errors) {
                        for (const [field, msg] of Object.entries(data.errors)) {
                            const errEl = document.getElementById(`err-${field}`);
                            if (errEl) {
                                errEl.innerText = Array.isArray(msg) ? msg.join(' ') : msg;
                            }
                        }
                        alertBox.innerHTML = `<div class="alert alert-danger">Please fix the highlighted errors below.</div>`;
                    } else {
                        alertBox.innerHTML = `<div class="alert alert-danger">${data.message || 'Registration failed.'}</div>`;
                    }
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Register Account';
                alertBox.innerHTML = `<div class="alert alert-danger">Network Error: Failed to reach backend API at ${API_BASE}.</div>`;
            }
        });
    </script>
</body>
</html>
