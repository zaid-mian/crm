<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptCRM - Sign In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 420px;
            width: 100%;
        }
        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
            color: #f8fafc;
        }
        .btn-primary {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .logo-text {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="text-white logo-text mb-1"><span class="text-primary">Adapt</span>CRM</h2>
            <p class="text-secondary small">Access your workspace panel</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small font-weight-medium">Username</label>
                <input type="text" class="form-control" name="username" placeholder="e.g. salesperson_1" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small font-weight-medium">Password</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>

            <div id="alertContainer"></div>

            <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">Sign In</button>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const alertContainer = document.getElementById('alertContainer');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
            alertContainer.innerHTML = '';

            const username = e.target.username.value.trim();
            const password = e.target.password.value;

            // Enforce default api_base_url if not set
            if (!localStorage.getItem('api_base_url')) {
                localStorage.setItem('api_base_url', 'http://localhost:8000');
            }

            try {
                // Set temporary username and password for authentication
                localStorage.setItem('auth_method', 'basic');
                localStorage.setItem('auth_username', username);
                localStorage.setItem('auth_password', password);

                const response = await APIClient.post('/api/login/', { username, password });
                if (response.success) {
                    const userType = response.data.user_type;
                    localStorage.setItem('user_type', userType);
                    
                    if (userType === 'ADMIN') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'app.html';
                    }
                } else {
                    throw new Error(response.message || 'Login failed.');
                }
            } catch (err) {
                // Clear credentials on failure
                localStorage.removeItem('auth_username');
                localStorage.removeItem('auth_password');
                
                alertContainer.innerHTML = `
                    <div class="alert alert-danger py-2 small" role="alert">
                        ${err.message || 'Invalid username or password.'}
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
