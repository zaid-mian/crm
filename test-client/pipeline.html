<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Sales Pipeline Board</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .kanban-column {
            min-width: 280px;
            width: 280px;
        }
        .kanban-list {
            min-height: 450px;
            background-color: #f8f9fa;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .kanban-list.sortable-ghost {
            background-color: #e9ecef;
            border: 2px dashed #0d6efd;
        }
        .kanban-card {
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .kanban-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08) !important;
        }
        .kanban-card:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="navbar-brand mb-0 h1 d-flex align-items-center">
                    <span class="text-primary me-2 font-weight-bold">&laquo;</span>
                    <span class="small font-weight-medium">AdaptCRM Pipeline Board</span>
                </a>
                <select class="form-select form-select-sm" id="pipelineSelect" style="width: 200px;">
                    <option value="">Loading pipelines...</option>
                </select>
                <a href="pipeline-settings.html" class="btn btn-outline-light btn-sm">Pipeline Settings</a>
            </div>
            <span class="navbar-text text-muted small">
                Connected Base: <span id="connectedBaseDisplay" class="font-monospace text-light">http://localhost:8000</span>
            </span>
        </div>
    </nav>

    <!-- Alert notifications container -->
    <div class="container-fluid px-4 mt-3" id="mainAlertContainer"></div>

    <div class="container-fluid px-4 my-4">
        <div class="row g-4">
            
            <!-- Left Kanban Board Area (75%) -->
            <div class="col-lg-9 col-xl-9">
                <div class="d-flex overflow-auto pb-4 gap-3" style="min-height: 600px;" id="kanbanBoard">
                    <!-- Columns will be loaded dynamically here -->
                </div>
            </div>

            <!-- Right Workspace Panel (25%): Developer Debugging Console -->
            <div class="col-lg-3 col-xl-3">
                <div class="card shadow-sm border-0 dev-panel">
                    <div class="card-header bg-dark text-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h6 class="mb-0 font-weight-semibold">Developer Debug Panel</h6>
                        <span class="badge bg-secondary font-monospace text-uppercase" style="font-size: 0.65rem;">API Logs</span>
                    </div>
                    
                    <div class="dev-panel-body p-3">
                        <!-- Dedicated Request Details Viewer -->
                        <div class="card border border-secondary border-opacity-10 shadow-none mb-3">
                            <div class="card-header bg-light py-2 border-bottom text-muted font-weight-medium small" style="font-size: 0.75rem;">
                                Active Request/Response Details
                            </div>
                            <div class="card-body p-3" id="requestDetailViewer">
                                <div class="text-center text-muted small py-4">Trigger an API event to inspect the JSON query structures.</div>
                            </div>
                        </div>

                        <!-- Real-time network transaction logs -->
                        <h6 class="text-secondary text-uppercase mb-2 font-weight-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">Network log history</h6>
                        <div class="list-group list-group-flush border rounded overflow-hidden" id="logList">
                            <div class="text-center py-3 text-muted small">No API calls recorded.</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Reusable Offcanvas Drawer Component (Bootstrap Right Panel) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="pipelineDrawer" aria-labelledby="drawerTitle" style="width: 450px;">
        <div class="offcanvas-header bg-light border-bottom">
            <h5 class="offcanvas-title font-weight-semibold" id="drawerTitle">Card Details</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="drawerContent">
            <!-- Dynamic Form contents injected here -->
        </div>
    </div>

    <!-- SortableJS Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- CRM Testing JS Core -->
    <script src="js/api.js?v=2"></script>
    <script src="js/utils.js"></script>
    <script src="js/pipeline.js?v=3"></script>
    <script>
        // Update connected Base Display URL on load
        document.addEventListener('DOMContentLoaded', () => {
            const display = document.getElementById('connectedBaseDisplay');
            if (display) {
                display.innerText = localStorage.getItem('api_base_url') || 'http://localhost:8000';
            }
        });
    </script>
</body>
</html>
