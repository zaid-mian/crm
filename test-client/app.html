<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptCRM - User Panel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .navbar-dark {
            background-color: #1e293b !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .nav-link {
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #3b82f6 !important;
        }
    </style>
</head>
<body>

    <!-- Route Protection Guard -->
    <script>
        const username = localStorage.getItem('auth_username');
        const userType = localStorage.getItem('user_type');
        if (!username || userType !== 'USER') {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1 font-weight-bold"><span class="text-primary">Adapt</span>CRM Workspace</span>
            <div class="collapse navbar-collapse ms-4" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light font-weight-medium px-3" href="leads.html">Leads</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light font-weight-medium px-3" href="companies.html">Companies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light font-weight-medium px-3" href="contacts.html">Contacts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light font-weight-medium px-3" href="opportunities.html">Opportunities</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light font-weight-medium px-3" href="pipeline.html">Pipeline Board</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex gap-3 align-items-center">
                <span class="text-secondary small">Signed in as <strong id="userUsername" class="text-white"></strong></span>
                <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container py-5 mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card card-custom p-5 shadow-lg">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-person-workspace text-primary" viewBox="0 0 16 16">
                            <path d="M4 16s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-5.95a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                            <path d="M2 1a2 2 0 0 0-2 2v9.5A1.5 1.5 0 0 0 1.5 14h.643a.5.5 0 0 0 .492-.41L3 11.5v-2H1v-5h12v5h-2v2l.365 2.09a.5.5 0 0 0 .492.41h.643a1.5 1.5 0 0 0 1.5-1.5V3a2 2 0 0 0-2-2z"/>
                        </svg>
                    </div>
                    <h1 class="font-weight-bold text-white mb-2">Welcome to User Panel</h1>
                    <p class="text-secondary mb-4">This is the central workspace area for managers and salespeople to interact with the customer relationship management modules.</p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="leads.html" class="btn btn-primary px-4">Leads Workspace</a>
                        <a href="pipeline.html" class="btn btn-outline-light px-4">Pipeline Board</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('userUsername').innerText = localStorage.getItem('auth_username') || 'User';
        
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await APIClient.post('/api/logout/');
            } catch (e) {
                // Ignore failure and clear local storage anyway
            }
            localStorage.removeItem('auth_username');
            localStorage.removeItem('auth_password');
            localStorage.removeItem('user_type');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
